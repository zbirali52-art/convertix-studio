<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-Source Bookings App | Convertix Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 antialiased selection:bg-emerald-500/20 selection:text-emerald-300 p-4 sm:p-8">

  <!-- Top App Bar -->
  <div class="max-w-4xl mx-auto mb-6 flex items-center justify-between bg-slate-900/80 border border-white/10 rounded-2xl p-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-lg font-bold">
        📅
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white leading-tight">OpenBook — Free Open-Source Booking Engine</h1>
        <p class="text-[11px] text-slate-400">Zero monthly fees • Replaces Wix Bookings ($29/mo) & Calendly ($16/mo)</p>
      </div>
    </div>
    <a href="../#portfolio" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-white transition-colors">
      ← Agency Home
    </a>
  </div>

  <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Step 1: Select Service -->
    <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-5 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Step 1</span>
          <span class="text-[10px] bg-emerald-500/10 text-emerald-300 px-2 py-0.5 rounded font-mono">Service</span>
        </div>
        <h2 class="text-base font-bold text-white mb-3">Choose Service</h2>
        
        <div class="space-y-2.5" id="service-list">
          <label class="service-card flex items-center justify-between p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-500/10 cursor-pointer transition-all">
            <div class="flex items-center gap-3">
              <input type="radio" name="service" value="Strategy & Audit Call" data-duration="30 min" data-price="Free" checked class="accent-emerald-500">
              <div>
                <span class="block text-xs font-bold text-white">Strategy & Audit Call</span>
                <span class="block text-[11px] text-slate-400">30 min • Video / Phone</span>
              </div>
            </div>
            <span class="text-xs font-bold text-emerald-400">Free</span>
          </label>

          <label class="service-card flex items-center justify-between p-3.5 rounded-xl border border-white/10 bg-slate-800/50 hover:border-white/20 cursor-pointer transition-all">
            <div class="flex items-center gap-3">
              <input type="radio" name="service" value="Dental Smile Consultation" data-duration="45 min" data-price="₹200" class="accent-emerald-500">
              <div>
                <span class="block text-xs font-bold text-white">Clinic Consultation</span>
                <span class="block text-[11px] text-slate-400">45 min • In-Person</span>
              </div>
            </div>
            <span class="text-xs font-bold text-slate-200">₹200</span>
          </label>

          <label class="service-card flex items-center justify-between p-3.5 rounded-xl border border-white/10 bg-slate-800/50 hover:border-white/20 cursor-pointer transition-all">
            <div class="flex items-center gap-3">
              <input type="radio" name="service" value="Interior Site Measurement" data-duration="60 min" data-price="Free" class="accent-emerald-500">
              <div>
                <span class="block text-xs font-bold text-white">Site Measurement Visit</span>
                <span class="block text-[11px] text-slate-400">60 min • On-Site</span>
              </div>
            </div>
            <span class="text-xs font-bold text-emerald-400">Free</span>
          </label>
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-white/5 text-[11px] text-slate-400">
        ✓ 100% Client-Side Sync<br>
        ✓ No server databases required
      </div>
    </div>

    <!-- Step 2: Date & Slot Selector -->
    <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Step 2</span>
        <span class="text-[10px] bg-emerald-500/10 text-emerald-300 px-2 py-0.5 rounded font-mono">Date & Time</span>
      </div>
      <h2 class="text-base font-bold text-white mb-3">Select Date & Time</h2>

      <div class="mb-4">
        <label class="block text-[11px] font-semibold text-slate-400 mb-1.5">Pick Date</label>
        <input type="date" id="booking-date" class="w-full px-3 py-2.5 rounded-xl bg-slate-800 border border-white/10 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-400 mb-2">Available Slots</label>
        <div class="grid grid-cols-2 gap-2" id="slots-container">
          <button type="button" onclick="selectSlot(this, '10:00 AM')" class="slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold">10:00 AM</button>
          <button type="button" onclick="selectSlot(this, '11:30 AM')" class="slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold">11:30 AM</button>
          <button type="button" onclick="selectSlot(this, '02:00 PM')" class="slot-btn py-2 px-2.5 rounded-lg border-2 border-emerald-500 bg-emerald-500/20 text-xs text-emerald-300 text-center transition-all font-bold">02:00 PM</button>
          <button type="button" onclick="selectSlot(this, '04:30 PM')" class="slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold">04:30 PM</button>
          <button type="button" onclick="selectSlot(this, '06:00 PM')" class="slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold">06:00 PM</button>
          <button type="button" onclick="selectSlot(this, '07:30 PM')" class="slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold">07:30 PM</button>
        </div>
      </div>
    </div>

    <!-- Step 3: Contact & Instant Confirmation -->
    <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-5 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Step 3</span>
          <span class="text-[10px] bg-emerald-500/10 text-emerald-300 px-2 py-0.5 rounded font-mono">Confirm</span>
        </div>
        <h2 class="text-base font-bold text-white mb-3">Your Information</h2>

        <div class="space-y-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Full Name</label>
            <input type="text" id="client-name" placeholder="Rahul Verma" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-white/10 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">WhatsApp / Phone Number</label>
            <input type="tel" id="client-phone" placeholder="+91 98765 43210" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-white/10 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Notes / Preferences (Optional)</label>
            <input type="text" id="client-notes" placeholder="Any specific requirements..." class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-white/10 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>

      <div class="mt-6 space-y-2">
        <button onclick="confirmBookingWhatsApp()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-2 transition-all shadow-md">
          <span>Book & Confirm on WhatsApp</span>
          <span>💬</span>
        </button>

        <button onclick="addToGoogleCalendar()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs flex items-center justify-center gap-1.5 transition-colors border border-white/10">
          <span>Add to Google Calendar</span>
          <span>📅</span>
        </button>
      </div>
    </div>

  </main>

  <script>
    // Initialize with tomorrow's date
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('booking-date').value = tomorrow.toISOString().split('T')[0];

    let selectedTime = '02:00 PM';

    function selectSlot(btn, time) {
      selectedTime = time;
      document.querySelectorAll('.slot-btn').forEach(b => {
        b.className = 'slot-btn py-2 px-2.5 rounded-lg border border-white/10 bg-slate-800 hover:border-emerald-500 text-xs text-white text-center transition-all font-semibold';
      });
      btn.className = 'slot-btn py-2 px-2.5 rounded-lg border-2 border-emerald-500 bg-emerald-500/20 text-xs text-emerald-300 text-center transition-all font-bold';
    }

    // Radio change border styling
    document.querySelectorAll('input[name="service"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.service-card').forEach(card => {
          card.className = 'service-card flex items-center justify-between p-3.5 rounded-xl border border-white/10 bg-slate-800/50 hover:border-white/20 cursor-pointer transition-all';
        });
        radio.closest('.service-card').className = 'service-card flex items-center justify-between p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-500/10 cursor-pointer transition-all';
      });
    });

    function getBookingDetails() {
      const serviceRadio = document.querySelector('input[name="service"]:checked');
      const serviceName = serviceRadio ? serviceRadio.value : 'Appointment';
      const duration = serviceRadio ? serviceRadio.dataset.duration : '30 min';
      const price = serviceRadio ? serviceRadio.dataset.price : 'Free';
      const date = document.getElementById('booking-date').value;
      const name = document.getElementById('client-name').value.trim() || 'Client';
      const phone = document.getElementById('client-phone').value.trim() || 'Not provided';
      const notes = document.getElementById('client-notes').value.trim() || 'None';

      return { serviceName, duration, price, date, time: selectedTime, name, phone, notes };
    }

    function confirmBookingWhatsApp() {
      const b = getBookingDetails();
      const text = encodeURIComponent(
        `*New Appointment Booking Request* 📅\n\n` +
        `• *Service:* ${b.serviceName} (${b.duration})\n` +
        `• *Fee:* ${b.price}\n` +
        `• *Date & Time:* ${b.date} at ${b.time}\n` +
        `• *Client Name:* ${b.name}\n` +
        `• *Phone:* ${b.phone}\n` +
        `• *Notes:* ${b.notes}\n\n` +
        `Hi! Please confirm my slot for this appointment.`
      );
      window.open(`https://wa.me/917410123901?text=${text}`, '_blank');
    }

    function addToGoogleCalendar() {
      const b = getBookingDetails();
      const title = encodeURIComponent(`${b.serviceName} - ${b.name}`);
      const details = encodeURIComponent(`Service: ${b.serviceName}\nClient Phone: ${b.phone}\nNotes: ${b.notes}`);
      
      // Approximate ISO format for Google Calendar
      const dateClean = b.date.replace(/-/g, '');
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${dateClean}T100000Z/${dateClean}T110000Z`;
      window.open(gcalUrl, '_blank');
    }
  </script>
</body>
</html>
